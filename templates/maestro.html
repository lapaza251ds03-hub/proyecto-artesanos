<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minka Community - Panel Maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fdfaf7] min-h-screen flex flex-col">

    <nav class="p-6 flex justify-between items-center bg-white shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-[#8d2323] rounded-full flex items-center justify-center text-white font-serif font-bold">M</div>
            <span class="font-serif text-xl text-[#3e2723]">Panel Maestro Artesano</span>
        </div>
        <a href="/logout" class="text-[10px] bg-gray-200 text-gray-700 px-4 py-2 rounded-full font-bold uppercase tracking-wider">Salir</a>
    </nav>

    <main class="max-w-6xl w-full mx-auto p-4 md:p-12 grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
        
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-serif mb-2 text-[#3e2723]">Registrar Nueva Obra</h2>
            <p class="text-xs text-gray-400 uppercase tracking-wider mb-6">Completa los datos para publicar en el catálogo global</p>
            
            <form action="/registrar" method="POST" enctype="multipart/form-data" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase mb-2 text-gray-500">Nombre de la Prenda</label>
                    <input type="text" id="input-prenda" name="prenda" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#8d2323]" placeholder="Ej. Poncho Kusillo Imperial" required>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-2 text-gray-500">Precio Venta (S/)</label>
                        <input type="number" id="input-precio" name="precio" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none" placeholder="150" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-2 text-gray-500">Horas de Trabajo</label>
                        <input type="number" id="input-horas" name="horas" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none" placeholder="45" required>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-2 text-gray-500">Dificultad de Confección</label>
                    <select id="input-dificultad" name="dificultad" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none">
                        <option>Baja</option>
                        <option selected>Media</option>
                        <option>Alta</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-2 text-gray-500">Fotografía de la Prenda</label>
                    <input type="file" id="input-archivo" name="archivo" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-[10px] file:font-bold file:uppercase file:bg-[#8d2323]/10 file:text-[#8d2323] file:cursor-pointer">
                </div>

                <button type="submit" class="w-full bg-[#8d2323] text-white p-4 rounded-xl font-bold uppercase tracking-widest hover:bg-[#6d1b1b] transition-colors pt-4">
                    Subir a Catálogo
                </button>
            </form>
        </div>

        <div class="sticky top-24">
            <span class="text-[10px] font-bold uppercase tracking-widest text-[#8d2323] block mb-4 text-center lg:text-left">👁️ Vista Preliminar (Así se verá en la tienda)</span>
            
            <div class="bg-white rounded-2xl overflow-hidden shadow-xl border border-gray-100 max-w-sm mx-auto lg:mx-0 flex flex-col">
                <div class="aspect-[4/5] overflow-hidden bg-gray-100 relative">
                    <img id="preview-img" src="https://via.placeholder.com/400x500?text=Esperando+Foto" class="w-full h-full object-cover">
                    <span id="preview-tag" class="absolute top-3 left-3 bg-white/90 backdrop-blur px-2.5 py-1 rounded-full text-[9px] font-bold uppercase tracking-wider text-[#3e2723]">
                        Media
                    </span>
                </div>
                <div class="p-5">
                    <h3 id="preview-prenda" class="font-serif text-xl text-[#3e2723] mb-1">Nombre de tu prenda</h3>
                    <p id="preview-horas" class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-4">0 Horas de Dedicación</p>
                    
                    <div class="flex justify-between items-center pt-2 border-t border-gray-50">
                        <span id="preview-precio" class="font-serif text-xl text-[#3e2723] font-bold">S/ 0.00</span>
                        <button disabled class="bg-gray-300 text-white px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest cursor-not-allowed">
                            Añadir
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const inPrenda = document.getElementById('input-prenda');
        const inPrecio = document.getElementById('input-precio');
        const inHoras = document.getElementById('input-horas');
        const inDificultad = document.getElementById('input-dificultad');
        const inArchivo = document.getElementById('input-archivo');

        const viewPrenda = document.getElementById('preview-prenda');
        const viewPrecio = document.getElementById('preview-precio');
        const viewHoras = document.getElementById('preview-horas');
        const viewDificultad = document.getElementById('preview-tag');
        const viewImg = document.getElementById('preview-img');

        // Escuchar textos y números
        inPrenda.addEventListener('input', () => viewPrenda.innerText = inPrenda.value || "Nombre de tu prenda");
        inPrecio.addEventListener('input', () => viewPrecio.innerText = inPrecio.value ? "S/ " + parseFloat(inPrecio.value).toFixed(2) : "S/ 0.00");
        inHoras.addEventListener('input', () => viewHoras.innerText = (inHoras.value || "0") + " Horas de Dedicación");
        inDificultad.addEventListener('change', () => viewDificultad.innerText = inDificultad.value);

        // Pre-cargar la imagen en el navegador sin enviarla todavía al servidor
        inArchivo.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    viewImg.setAttribute('src', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>

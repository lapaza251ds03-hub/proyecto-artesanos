<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Artesanías - Cusco Directo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: #8B4513; color: white; padding: 60px 0; text-align: center; }
        .card { transition: transform 0.2s; border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card:hover { transform: scale(1.05); }
    </style>
    <style>
        .card-img-top {
        width: 100%;
        height: 250px;       /* Altura fija para todas */
        object-fit: cover;   /* Recorta la imagen para que rellene el espacio sin deformarse */
        border-bottom: 1px solid #ddd;
      }
    </style>
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Minka Comunity</a>
            <a href="/login" class="btn btn-outline-light btn-sm">Acceso Maestro</a>
            <a href="/comprar/{{ p[0] }}" class="btn btn-success" onclick="return confirm('¿Confirmar compra?')"> Comprar ahora </a>
        </div>
    </nav>

    <header class="hero">
        <h1>Artesanías de Cusco</h1>
        <p>Directo del maestro a tus manos</p>
    </header>

    <div class="container my-5">
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for p in productos %}
            <div class="col">
                <div class="card h-100">
                    <img src="{{ p[7] if p[7] else 'https://via.placeholder.com/300' }}" class="card-img-top" alt="{{ p[1] }}" style="height: 250px; object-fit: cover;">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ p[1] }}</h5>
                        <p class="card-text text-muted">Dificultad: {{ p[5] }}</p>
                        <h4 class="text-success">S/ {{ p[2] }}</h4>
                    </div>
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ p[1] }}</h5>
                        <h4 class="text-success">S/ {{ p[2] }}</h4>
                        <a href="/comprar/{{ p[0] }}" class="btn btn-primary w-100" onclick="return confirm('¿Estás seguro de comprar esta artesanía única?')">
                            Comprar ahora
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
